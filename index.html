<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ecdc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1914" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="驿书">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>驿书</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: one full-screen paper page; pages turn on the left spine like a bound book */
:root{
  --paper:#f3ecdc; --ink:#2a251e; --muted:#94866d; --accent:#8a6a3c;
  --rule:#cdbf9f; --spine:rgba(90,62,20,.16); --shade:rgba(40,28,10,.22); --bar:rgba(243,236,220,.94);
  --serif:'Noto Serif SC','Songti SC','STSong','Source Han Serif SC','SimSun',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1d1914; --ink:#e6dccb; --muted:#8c7f69; --accent:#c9a46a;
  --rule:#4a4133; --spine:rgba(0,0,0,.45); --shade:rgba(0,0,0,.5); --bar:rgba(29,25,20,.94); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1d1914; --ink:#e6dccb; --muted:#8c7f69; --accent:#c9a46a;
  --rule:#4a4133; --spine:rgba(0,0,0,.45); --shade:rgba(0,0,0,.5); --bar:rgba(29,25,20,.94); color-scheme:dark}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#book{position:relative;height:100%;perspective:2000px;overflow:hidden;touch-action:none}
.page{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;
  padding-block:20px 14px;padding-left:max(26px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));
  transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.page::before{content:"";position:absolute;top:0;bottom:0;left:0;width:16px;pointer-events:none;
  background:linear-gradient(to right,var(--spine),transparent)}
.measure{visibility:hidden;pointer-events:none;z-index:-5}
.head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.25em;
  border-bottom:.5px solid var(--rule);padding-bottom:7px}
.body{position:relative;flex:1;min-height:0;overflow:hidden;padding-top:20px;display:flex;flex-direction:column;gap:14px}
.foot{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.3em;padding-top:10px}
.post p{margin:0;font-size:16.5px;line-height:1.95;text-align:justify;text-indent:2em;letter-spacing:.02em;overflow-wrap:anywhere}
.post p+p{margin-top:.35em}
.post.comment:not(.cont)::before{content:"评论";display:block;font-size:11px;letter-spacing:.18em;color:var(--accent);margin-bottom:4px}
.post.comment.cont::before{content:"续评";display:block;font-size:10px;letter-spacing:.15em;color:var(--muted);margin-bottom:4px}
.post p.q{text-indent:0;margin-left:1em;padding-left:.8em;border-left:2px solid var(--rule);color:var(--muted)}
.post.cont p:first-child,.post.has-dc p:first-child{text-indent:0}
.dc{float:left;font-size:3.05em;line-height:1;margin:.1em .14em 0 0;color:var(--accent);font-weight:600}
.by{text-align:right;font-size:13px;color:var(--accent);margin-top:6px;letter-spacing:.1em;clear:both}
.orn{text-align:center;color:var(--rule);font-size:11px;letter-spacing:.6em;margin:0;line-height:1}
/* cover */
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center}
.ttl{border-top:.5px solid var(--rule);border-bottom:.5px solid var(--rule);padding:22px 8px;width:min(78%,300px)}
.kicker{margin:0;font-size:11px;letter-spacing:.4em;color:var(--muted)}
.ttl h1{margin:12px 0 10px;font-size:40px;font-weight:600;letter-spacing:.35em;text-indent:.35em}
.sub{margin:0;font-size:13px;color:var(--muted);letter-spacing:.12em}
form{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(80%,300px)}
label{font-size:12px;color:var(--muted);letter-spacing:.3em}
input{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:.5px solid var(--rule);
  padding:8px 2px;text-align:center;outline:none;font-size:16px;-webkit-user-select:text;user-select:text}
input:focus{border-bottom-color:var(--accent)}
button{font:inherit;color:var(--ink);background:transparent;border:.5px solid var(--ink);border-radius:3px;padding:7px 26px;
  font-size:14px;letter-spacing:.4em;text-indent:.4em;cursor:pointer}
button:focus-visible,input:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
.alt{display:flex;gap:18px}
.alt button,.link{border:0;padding:4px 2px;font-size:12px;letter-spacing:.15em;text-indent:0;color:var(--muted);
  text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
.err{min-height:1.4em;margin:0;font-size:12px;color:var(--accent);max-width:80%;line-height:1.6}
.imprint{margin:0;font-size:11px;color:var(--muted);letter-spacing:.3em}
.reader{font-size:14px;letter-spacing:.2em;margin:0}
.hint{font-size:12px;color:var(--muted);letter-spacing:.3em;margin:0;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
/* chapter */
.chap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.chap .no{margin:0;font-size:12px;letter-spacing:.5em;color:var(--muted)}
.vdate{margin:6px 0;writing-mode:vertical-rl;font-size:36px;font-weight:600;letter-spacing:.3em}
.chap .meta{margin:0;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.chap .yr{margin:18px 0 0;font-size:11px;letter-spacing:.3em;color:var(--muted)}
/* turning */
.sheen{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(to left,var(--shade),transparent 70%)}
.turn-out{z-index:4;animation:out .58s cubic-bezier(.35,.05,.25,1) forwards}
.turn-out>.sheen{animation:fadein .58s forwards}
.turn-in{z-index:4;animation:in .58s cubic-bezier(.35,.05,.25,1) forwards}
.turn-in>.sheen{animation:fadeout .58s forwards}
.under::after,.under-back::after{content:"";position:absolute;inset:0;background:var(--shade);pointer-events:none}
.under::after{animation:fadeout .58s forwards}
.under-back::after{opacity:0;animation:fadein .58s forwards}
@keyframes out{to{transform:rotateY(-104deg)}}
@keyframes in{from{transform:rotateY(-104deg)}to{transform:none}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.fade-in{z-index:4;animation:fadeout .25s reverse forwards}
@media (prefers-reduced-motion: reduce){.hint{animation:none}}
/* chrome */
.bar{position:absolute;top:0;left:0;right:0;z-index:10;background:var(--bar);border-bottom:.5px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding-top:max(10px, env(safe-area-inset-top, 0px));padding-bottom:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.head .home{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0 8px 0 0;cursor:pointer}
.head .when{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0 0 0 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px}
.head .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.bar .where{font-size:12px;color:var(--muted);letter-spacing:.15em}
.bar .acts{display:flex;gap:14px}
.new-posts{position:absolute;z-index:12;top:max(58px,calc(env(safe-area-inset-top,0px) + 58px));right:18px;background:var(--bar);border-color:var(--rule);color:var(--accent);font-size:12px;letter-spacing:.1em;padding:8px 12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:11;background:var(--bar);
  border:.5px solid var(--rule);border-radius:3px;padding:8px 16px;font-size:12px;letter-spacing:.15em;color:var(--muted);white-space:nowrap}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.end h2{margin:0;font-size:22px;font-weight:600;letter-spacing:.5em;text-indent:.5em}
.end p{margin:0;font-size:12px;letter-spacing:.2em;color:var(--muted)}
/* Writer is a separate paper layer. Reading/book pages are unchanged. */
.writer-overlay{position:fixed;inset:0;z-index:50;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);color:var(--ink);padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left))}
.writer-paper{max-width:680px;min-height:100%;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 0 calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.writer-top{display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--rule);padding-bottom:14px;gap:12px}
.writer-top h2{margin:0;font-size:14px;letter-spacing:.24em;font-weight:400;color:var(--muted)}
.writer-top button,.writer-foot button{border:0;font-size:13px;letter-spacing:.08em;padding:8px 3px;text-indent:0;color:var(--accent)}
.writer-caption{font-size:12px;color:var(--muted);letter-spacing:.15em}
.writer-text{flex:1;min-height:min(50vh,420px);resize:vertical;width:100%;border:0;background:transparent;color:var(--ink);font:16.5px/2 var(--serif);text-align:left;letter-spacing:.02em;outline:none;-webkit-user-select:text;user-select:text;padding:6px 0}
.writer-text::placeholder{color:var(--muted);opacity:.65}
.writer-foot{border-top:.5px solid var(--rule);padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.writer-meta{font-size:11px;color:var(--muted);line-height:1.8}
.writer-status{min-height:24px;font-size:12px;line-height:1.7;color:var(--accent);white-space:normal;overflow-wrap:anywhere}
.writer-status.error{color:#b44a39}
.writer-panel{border-top:.5px solid var(--rule);display:flex;flex-direction:column;gap:12px;padding-top:16px}
.writer-panel h3{font-weight:400;font-size:14px;margin:0;letter-spacing:.12em}
.writer-panel p{margin:0;color:var(--muted);font-size:12px;line-height:1.8}
.writer-panel input{font-size:14px;text-align:left;border-bottom:.5px solid var(--rule);border-radius:0}
.writer-panel button,.writer-publish{border:.5px solid var(--rule);border-radius:3px;color:var(--ink);font-size:13px;padding:9px 14px;letter-spacing:.08em;text-indent:0}
.writer-note{font-size:11px;color:var(--muted);line-height:1.8}
.writer-publish{border-color:var(--accent);color:var(--accent);padding-inline:20px}
.writer-foot button[disabled],.writer-panel button[disabled]{opacity:.5}
@media (max-width:420px){.writer-paper{gap:12px}.writer-top h2{font-size:12px}.writer-foot{gap:6px}.writer-text{min-height:42vh}}
</style>

</head>
<body>
<div id="book" aria-live="polite">
  <div class="bar" id="bar" hidden>
    <span class="where" id="where"></span>
    <span class="acts">
      <button class="link" id="writePost" type="button">写</button>
      <button class="link" id="syncNow">同步</button>
      <button class="link" id="toLatest">回到最新</button>
      <button class="link" id="toCover">封面</button>
      <button class="link" id="logout">换读者</button>
    </span>
  </div>
  <button type="button" class="new-posts" id="newPosts" aria-live="polite" hidden></button>
  <div class="toast" id="toast" hidden></div>
</div>
<section class="writer-overlay" id="writerOverlay" role="dialog" aria-modal="true" aria-labelledby="writerTitle" hidden>
  <div class="writer-paper">
    <header class="writer-top">
      <button type="button" id="writerClose">返回书页</button>
      <h2 id="writerTitle">驿书 · 随笔</h2>
      <span class="writer-caption">◇</span>
    </header>
    <p class="writer-caption">写下你想留下的文字</p>
    <textarea id="writerText" class="writer-text" placeholder="此刻，想写点什么……" maxlength="12000" spellcheck="true" aria-label="随笔正文"></textarea>
    <p class="writer-meta" id="writerSaved" aria-live="polite">草稿保存在本机</p>
    <section class="writer-panel" id="writerSetup" hidden>
      <h3>第一次发表 · 设置加密私钥</h3>
      <p>输入当前阅读账号的 nsec。私钥在这台设备本地加密，不发送给服务器。请勿在共享设备使用；密码遗失需重新导入私钥。</p>
      <input id="writerSecret" type="password" placeholder="nsec1… 或 64 位十六进制私钥" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Nostr 私钥">
      <input id="writerNewPass" type="password" placeholder="加密密码（至少 12 字符）" autocomplete="new-password" aria-label="设置加密密码">
      <input id="writerNewPassConfirm" type="password" placeholder="再输入一次加密密码" autocomplete="new-password" aria-label="确认加密密码">
      <button type="button" id="writerSaveKey">加密保存</button>
    </section>
    <section class="writer-panel" id="writerUnlock" hidden>
      <h3>发表前解锁</h3>
      <p>仅本次签名时解锁；成功或失败后不保留解密私钥。联网后发送 Nostr kind 1 动态。</p>
      <input id="writerUnlockPass" type="password" placeholder="本地解锁密码" autocomplete="off" aria-label="私钥解锁密码">
      <button type="button" id="writerSend">解锁并发表</button>
    </section>
    <p id="writerStatus" class="writer-status" role="status" aria-live="polite"></p>
    <footer class="writer-foot">
      <div class="writer-meta"><span id="writerKeyState">尚未设置签名密钥</span></div>
      <div><button type="button" id="writerImport">设置本地私钥</button>
      <button type="button" id="writerPublish" class="writer-publish">发表</button>
      <button type="button" id="writerPublished" hidden>返回阅读</button></div>
    </footer>
    <p class="writer-note">阅读与写作无需私钥。发表需要联网；如果 Relay 未确认接收，草稿会保留。卸载应用或清理网站数据可能清除本地草稿和加密密钥。</p>
  </div>
</section>

<script>
(() => {
'use strict';
/* ---------- 设置 ---------- */
const BOOK = '驿书';
const spaced = t => [...t].join(' ');
const DEFAULT_RELAYS = ['wss://relay.damus.io','wss://nos.lol','wss://relay.primal.net'];
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const RELAYS = LS.get('book.relays', DEFAULT_RELAYS);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 中文数字与日期 ---------- */
const D = '零一二三四五六七八九';
function cn(n){
  if (n < 10) return D[n];
  if (n < 20) return '十' + (n % 10 ? D[n % 10] : '');
  if (n < 100) return D[Math.floor(n/10)] + '十' + (n % 10 ? D[n % 10] : '');
  if (n < 1000){ const h = Math.floor(n/100), r = n % 100;
    return D[h] + '百' + (r === 0 ? '' : r < 10 ? '零' + D[r] : (r < 20 ? '一' : '') + cn(r)); }
  const t = Math.floor(n/1000), r = n % 1000;
  return D[t] + '千' + (r === 0 ? '' : r < 100 ? '零' + (r < 20 && r >= 10 ? '一' : '') + cn(r) : cn(r));
}
function cnDay(d){
  if (d <= 10) return cn(d);
  if (d < 20) return '十' + D[d-10];
  if (d === 20) return '二十';
  if (d < 30) return '廿' + D[d-20];
  if (d === 30) return '三十';
  return '卅一';
}
const yearCn = y => String(y).split('').map(c => '〇一二三四五六七八九'[+c]).join('');
function dayKey(t){ const d = new Date(t*1000); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function keyParts(k){ const [y,m,d] = k.split('-').map(Number); return {y,m,d}; }
const mdLabel = k => { const {m,d} = keyParts(k); return cn(m) + '月' + cnDay(d) + '日'; };

/* ---------- npub 解码 ---------- */
const CH = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
function toHex(s){
  s = s.trim().toLowerCase().replace(/^nostr:/, '');
  if (/^[0-9a-f]{64}$/.test(s)) return s;
  if (!s.startsWith('npub1')) return null;
  const vals = [];
  for (const c of s.slice(5)){ const v = CH.indexOf(c); if (v < 0) return null; vals.push(v); }
  let acc = 0, bits = 0; const out = [];
  for (const v of vals.slice(0, -6)){
    acc = (acc << 5) | v; bits += 5;
    while (bits >= 8){ bits -= 8; out.push((acc >> bits) & 255); }
    acc &= (1 << bits) - 1;
  }
  if (out.length !== 32) return null;
  return out.map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- 中继查询 ---------- */
let relayReached = false;
function query(filters, timeout = 7000, relays = RELAYS){
  return new Promise(resolve => {
    const evs = new Map(); let pending = relays.length, done = false; const socks = [];
    const sub = 'b' + Math.random().toString(36).slice(2, 9);
    const finish = () => { if (done) return; done = true; clearTimeout(timer);
      socks.forEach(w => { try{ w.close(); }catch(e){} }); resolve([...evs.values()]); };
    const timer = setTimeout(finish, timeout);
    relays.forEach(url => {
      let ended = false; const end = () => { if (ended) return; ended = true; if (--pending <= 0) finish(); };
      let w; try { w = new WebSocket(url); } catch(e){ end(); return; }
      socks.push(w);
      w.onopen = () => { relayReached = true; try{ w.send(JSON.stringify(['REQ', sub, ...filters])); }catch(e){ end(); } };
      w.onmessage = m => {
        let d; try{ d = JSON.parse(m.data); }catch(e){ return; }
        if (d[0] === 'EVENT' && d[1] === sub && d[2] && d[2].id){ if (!evs.has(d[2].id)) evs.set(d[2].id, d[2]); }
        else if ((d[0] === 'EOSE' || d[0] === 'CLOSED') && d[1] === sub) end();
      };
      w.onerror = end; w.onclose = end;
    });
  });
}
const chunk = (a, n) => { const r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; };

/* ---------- 昵称 ---------- */
const names = LS.get('book.names', {});
const nameUpdated = LS.get('book.names.updated', {});
const nameOf = pk => names[pk] || ('无名氏·' + pk.slice(0, 4));
// 资料（kind 0）分散在各中继，额外问两个专门收录资料的中继
const PROFILE_RELAYS = [...new Set([...RELAYS, 'wss://purplepag.es', 'wss://user.kindpag.es'])];
const nameTries = {};
async function ensureNames(pks){
  const now = Date.now();
  const miss = [...new Set(pks)].filter(pk => (!names[pk] || now - (nameUpdated[pk] || 0) > 86400000) && (nameTries[pk] || 0) < 2);
  if (!miss.length) return;
  miss.forEach(pk => { nameTries[pk] = (nameTries[pk] || 0) + 1; nameUpdated[pk] = now; });
  const res = await Promise.all(chunk(miss, 150).map(a => query([{kinds:[0], authors:a}], 7000, PROFILE_RELAYS)));
  const best = {};
  res.flat().forEach(e => { if (!best[e.pubkey] || best[e.pubkey].created_at < e.created_at) best[e.pubkey] = e; });
  Object.values(best).forEach(e => {
    try{ const c = JSON.parse(e.content);
      const n = [c.display_name, c.displayName, c.name, String(c.nip05 || '').split('@')[0].replace(/^_$/, '')]
        .map(x => typeof x === 'string' ? x.trim() : '').find(Boolean) || '';
      if (n) names[e.pubkey] = n.slice(0, 24); }catch(err){}
  });
  LS.set('book.names', names);
  LS.set('book.names.updated', nameUpdated);
  document.querySelectorAll('.by[data-pk]').forEach(b => { b.textContent = '—— ' + nameOf(b.dataset.pk); });
}

/* ---------- 正文清理：只留文字 ---------- */
const CONTENT_KINDS = [1, 1111];
const MIN_COMMENT_HAN = 20;
function clean(ev){
  if (!CONTENT_KINDS.includes(ev.kind)) return null;
  const tags = Array.isArray(ev.tags) ? ev.tags : [];
  if (tags.some(t => t[0] === 'content-warning')) return null;
  // NIP-10 replies and NIP-22 (kind 1111) comments.
  const comment = ev.kind === 1111 || tags.some(t => t[0] === 'e' && t[3] !== 'mention');
  const s = String(ev.content || '')
    .replace(/(?:nostr:)?(?:npub|nprofile|note|nevent|naddr)1[02-9ac-hj-np-z]+/gi, '')
    .replace(/https?:\/\/\S+/gi, '').replace(/\bwww\.\S+/gi, '')
    .replace(/[ \t　]+/g, ' ').replace(/ *\n */g, '\n').replace(/\n{2,}/g, '\n').trim();
  // Only count the commenter's own Han characters, not quoted parent content.
  const ownText = s.split('\n').filter(line => !/^[>＞]/.test(line.trim())).join('');
  if (comment && (ownText.match(/\p{Script=Han}/gu) || []).length < MIN_COMMENT_HAN) return null;
  if (s.replace(/[\s\p{P}\p{S}]/gu, '').length < 4) return null;
  return { id: ev.id, pk: ev.pubkey, t: ev.created_at,
    paras:s.split('\n').map(x=>x.trim()).filter(Boolean), comment };
}

const overflows = () => MB.scrollHeight > MB.clientHeight + 1;

function postEl(paras, pk, {dc = false, cont = false, by = true, comment = false} = {}){
  const d = document.createElement('div'); d.className = 'post' + (cont ? ' cont' : '') + (comment ? ' comment' : '');
  paras.forEach((tx, i) => {
    const p = document.createElement('p');
    if (i === 0 && dc && /^[㐀-鿿]/.test(tx)){
      d.classList.add('has-dc');
      const s = document.createElement('span'); s.className = 'dc'; s.textContent = tx[0];
      p.append(s, tx.slice(1));
    } else if (/^[>＞]/.test(tx)){ p.className = 'q'; p.textContent = tx.replace(/^[>＞]\s*/, ''); }
    else p.textContent = tx;
    d.append(p);
  });
  if (by){ const b = document.createElement('div'); b.className = 'by'; b.dataset.pk = pk; b.textContent = '—— ' + nameOf(pk); d.append(b); }
  return d;
}
function ornEl(){ const o = document.createElement('p'); o.className = 'orn'; o.textContent = '◇'; return o; }
const toParas = s => s.split('\n').map(x => x.trim()).filter(Boolean);
const BREAK = '。！？；，、：…!?;,. \n';

function trySplit(paras, dc, cont, comment = false){
  const full = paras.join('\n');
  let lo = 1, hi = full.length - 1, best = 0;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    const el = postEl(toParas(full.slice(0, mid)), '', {dc, cont, by:false, comment});
    MB.append(el); const ok = !overflows(); el.remove();
    if (ok){ best = mid; lo = mid + 1; } else hi = mid - 1;
  }
  if (best < 14) return null;
  for (let k = best; k > best - 26 && k > 10; k--){ if (BREAK.includes(full[k-1])){ best = k; break; } }
  const rest = toParas(full.slice(best));
  if (!rest.length) return null;
  return { el: postEl(toParas(full.slice(0, best)), '', {dc, cont, by:false, comment}), rest };
}

let pages = [], chapterNo = 0, days = [];
let pageKey = '', pageAnchor = null;
function flushPage(){
  pages.push({ type:'text', key:pageKey, html:MB.innerHTML, anchor:pageAnchor });
  MB.innerHTML = ''; pageAnchor = null;
}
function paginateDay(day){
  chapterNo++;
  pages.push({ type:'chap', no:chapterNo, key:day.key, count:day.posts.length,
    authors:new Set(day.posts.map(p => p.pk)).size, anchor:day.posts[0].id });
  pageKey = day.key; MB.innerHTML = ''; pageAnchor = null;
  let first = true;
  for (const p of day.posts){
    let paras = p.paras, cont = false;
    for (let guard = 0; guard < 60; guard++){
      const had = MB.childElementCount > 0;
      const orn = had ? ornEl() : null; if (orn) MB.append(orn);
      const el = postEl(paras, p.pk, {dc: first && !cont && !p.comment, cont, comment:!!p.comment});
      MB.append(el);
      if (!overflows()){ if (!pageAnchor) pageAnchor = p.id; break; }
      el.remove();
      const used = orn ? orn.offsetTop + orn.offsetHeight : 0;
      const free = MB.clientHeight - used;
      const split = (!had || free > MB.clientHeight * 0.38) ? trySplit(paras, first && !cont && !p.comment, cont, !!p.comment) : null;
      if (split){ MB.append(split.el); if (!pageAnchor) pageAnchor = p.id; flushPage(); paras = split.rest; cont = true; continue; }
      if (orn) orn.remove();
      if (!had){ MB.append(el); if (!pageAnchor) pageAnchor = p.id; flushPage(); break; }
      flushPage();
    }
    first = false;
  }
  if (MB.childElementCount) flushPage();
}

/* ---------- 数据加载 ---------- */
let session = null, follows = [], cursor = 0, loading = false, exhausted = false, held = [], seen = new Set();
let readerName = '';

function groupDays(posts){
  posts.sort((a, b) => b.t - a.t);
  const out = [];
  posts.forEach(p => { const k = dayKey(p.t); const last = out[out.length - 1];
    if (last && last.key === k) last.posts.push(p); else out.push({ key:k, posts:[p] }); });
  return out;
}
async function fetchBatch(){
  if (session.demo) { const evs = demoEvents.filter(e => e.created_at <= cursor); cursor = 0; return evs; }
  const now = Math.floor(Date.now() / 1000) + 600;
  const res = await Promise.all(chunk(follows, 250).map(a => query([{ kinds:CONTENT_KINDS, authors:a, until:cursor, limit:150 }], 8000)));
  const all = new Map(); let edge = 0, minAll = Infinity;
  res.forEach(list => {
    const ok = list.filter(e => e.created_at <= now);
    if (!ok.length) return;
    const mn = Math.min(...ok.map(e => e.created_at)); minAll = Math.min(minAll, mn);
    if (list.length >= 120) edge = Math.max(edge, mn);
    ok.forEach(e => all.set(e.id, e));
  });
  if (!all.size) return [];
  const cut = edge || minAll;
  cursor = cut - 1;
  return [...all.values()].filter(e => e.created_at >= cut);
}
async function loadMore(){
  if (loading || exhausted || !session) return;
  loading = true;
  try {
    let added = 0;
    for (let round = 0; round < 5 && !added; round++){
      let evs = (await fetchBatch()).filter(e => !seen.has(e.id));
      if (!evs.length && pages.length <= 1 && !session.demo) evs = (await fetchBatch()).filter(e => !seen.has(e.id));  // 第一批空了多半是网络抖动，再试一次
      if (!evs.length){ exhausted = true; break; }
      evs.forEach(e => seen.add(e.id));
      const posts = evs.map(clean).filter(Boolean);
      if (!session.demo) await ensureNames(posts.map(p => p.pk));
      held = held.concat(posts);
      const groups = groupDays(held);
      held = groups.length ? groups.pop().posts : [];
      groups.forEach(g => { days.push(g); paginateDay(g); added++; });
      if (round === 4 && !added && held.length){ const g = { key: dayKey(held[0].t), posts: held }; held = []; days.push(g); paginateDay(g); added++; }
    }
    if (exhausted && held.length){ const g = { key: dayKey(held[0].t), posts: held }; held = []; days.push(g); paginateDay(g); }
    if (exhausted && !pages.some(p => p.type === 'end')) pages.push({ type:'end' });
  } finally { loading = false; }
  saveCache();
  if (applyPending && fresh.length) setTimeout(applyFresh, 0);
  if (!session.demo) ensureNames(days.flatMap(d => d.posts.map(p => p.pk))).catch(() => {});  // 没取到的昵称再试一次
}

/* ---------- 实时同步：订阅新动态，定时补漏，回到前台恢复 ---------- */
let fresh = [], lastCheck = 0, checking = false, applyPending = false;
let liveEpoch = 0, liveSockets = new Set(), liveTimers = new Set(), flushTimer = null;
let hiddenAt = 0, lastFollowsCheck = 0;
const BACKFILL_OVERLAP = 3600;     // 回看一小时，补齐延迟传播和临时掉线的事件
const FOLLOW_REFRESH_MS = 5 * 60000;
const FOLLOW_HISTORY = 7 * 86400;
let pendingFollowBackfill = new Map(), commentsBackfillNeeded = false;
const relayHints = LS.get('book.relayHints.v1', {});
const relayHintChecked = LS.get('book.relayHintChecked.v1', {});
let findingRelayHints = false;
function normalizedRelay(s){
  try {
    const u = new URL(String(s).trim());
    const h = u.hostname.toLowerCase();
    if (u.protocol !== 'wss:' || u.username || u.password || h === 'localhost' ||
      h.endsWith('.local') || /^127\./.test(h) || /^10\./.test(h) ||
      /^192\.168\./.test(h) || /^169\.254\./.test(h) ||
      /^172\.(1[6-9]|2\d|3[01])\./.test(h)) return null;
    return u.href.replace(/\/$/, '');
  } catch(e){ return null; }
}
function relayPlans(){
  const primary = [...new Set(RELAYS.map(normalizedRelay).filter(Boolean))];
  const extras = new Map();
  for (const pk of follows){
    for (const url of (relayHints[pk] || [])){
      if (primary.includes(url)) continue;
      if (!extras.has(url)) extras.set(url,new Set());
      extras.get(url).add(pk);
    }
  }
  const ranked = [...extras].sort((a,b) => b[1].size - a[1].size).slice(0,8);
  return [...primary.map(url => ({url,authors:follows.slice()})),
    ...ranked.map(([url,authors]) => ({url,authors:[...authors]}))];
}
async function refreshRelayHints(){
  if (!session || session.demo || findingRelayHints) return;
  const sess = session, now = Date.now();
  const targets = [...new Set([session.pk,...follows])].filter(pk => now - (relayHintChecked[pk] || 0) > 6*3600000);
  if (!targets.length) return;
  findingRelayHints = true;
  try {
    const result = await Promise.all(chunk(targets,100).map(authors =>
      query([{kinds:[10002], authors, limit:200}], 7500, PROFILE_RELAYS)));
    if (session !== sess) return;
    const latest = new Map(), wanted = new Set(targets);
    result.flat().forEach(e => {
      if (!e || e.kind !== 10002 || !wanted.has(e.pubkey)) return;
      if (!latest.has(e.pubkey) || e.created_at > latest.get(e.pubkey).created_at)
        latest.set(e.pubkey,e);
    });
    targets.forEach(pk => {
      relayHintChecked[pk] = now;
      const event = latest.get(pk);
      if (!event) return;
      relayHints[pk] = [...new Set((event.tags || [])
        .filter(t => t[0] === 'r' && (!t[2] || t[2] === 'write'))
        .map(t => normalizedRelay(t[1])).filter(Boolean))].slice(0,4);
    });
    LS.set('book.relayHints.v1',relayHints);
    LS.set('book.relayHintChecked.v1',relayHintChecked);
    startLive(); checkFresh();
  } catch(e) {} finally { findingRelayHints = false; }
}
const whenHTML = key => fresh.length
  ? '<button class="when" title="有新篇章，点此装订">' + mdLabel(key) + '<i class="dot"></i></button>'
  : '<span>' + mdLabel(key) + '</span>';
function updateDot(){
  const badge = document.getElementById('newPosts');
  badge.hidden = !fresh.length;
  if (fresh.length) badge.textContent = '新到 ' + fresh.length + ' 篇 · 阅读';
  const h = curEl && curEl.querySelector('.head'), pg = pages[idx];
  if (h && pg && pg.key) h.lastElementChild.outerHTML = whenHTML(pg.key);
}
function applyFresh(){
  if (!fresh.length) return;
  if (busy || loading){ applyPending = true; updateDot(); return; }
  applyPending = false;
  const prevIndex = idx, posts = fresh;
  fresh = [];
  posts.forEach(p => seen.add(p.id));
  // 按真实日期重新分组；迟到的旧日期不能错误插入书的最前面。
  const merged = new Map();
  days.flatMap(d => d.posts).concat(posts).forEach(p => merged.set(p.id, p));
  days = groupDays([...merged.values()]);
  pages = [{ type:'cover' }]; chapterNo = 0;
  days.forEach(paginateDay);
  if (exhausted) pages.push({ type:'end' });
  bar.hidden = true;
  show(prevIndex <= 2 ? Math.min(Math.max(1,prevIndex), pages.length - 1) : Math.min(1,pages.length - 1));
  saveCache();
  updateDot();
}
function queueFresh(events){
  if (!session || session.demo) return;
  const now = Math.floor(Date.now() / 1000) + 600;
  const have = new Set(fresh.map(p => p.id));
  let added = 0;
  for (const ev of events){
    if (!ev || !CONTENT_KINDS.includes(ev.kind) || !Number.isFinite(ev.created_at) || ev.created_at > now ||
        !follows.includes(ev.pubkey) || seen.has(ev.id) || have.has(ev.id)) continue;
    const post = clean(ev);
    if (!post) continue;
    fresh.push(post); have.add(post.id); added++;
  }
  if (!added) return;
  fresh.sort((a,b) => b.t - a.t);
  updateDot();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(() => {
    flushTimer = null;
    if (!session || session.demo) return;
    ensureNames(fresh.map(p => p.pk)).catch(() => {});
    if (idx <= 2 || applyPending) applyFresh();
    else updateDot();
  }, 600);
}
async function checkFresh(auto = false){
  if (!session || session.demo || checking || !follows.length ||
      document.visibilityState !== 'visible') return;
  const sess = session;
  checking = true;
  lastCheck = Date.now();
  try {
    const newest = days.length ? days[0].posts[0].t : Math.floor(Date.now()/1000)-FOLLOW_HISTORY;
    const since = Math.max(0, newest-BACKFILL_OVERLAP);
    const untilNow = Math.floor(Date.now() / 1000) + 600;
    // 每组独立翻页，防止高活跃账号填满 Relay 的 limit 而漏掉其他作者。
    const tasks = [];
    for (const plan of relayPlans()){
      for (const authors of chunk(plan.authors,100))
        tasks.push({url:plan.url,authors,since});
      const newAuthors = plan.authors.filter(pk => pendingFollowBackfill.has(pk));
      for (const authors of chunk(newAuthors,30))
        tasks.push({url:plan.url,authors,since:Math.max(0,untilNow-FOLLOW_HISTORY)});
      if (commentsBackfillNeeded) for (const authors of chunk(plan.authors,50))
        tasks.push({url:plan.url,authors,since:Math.max(0,untilNow-FOLLOW_HISTORY)});
    }
    const batches = await Promise.all(tasks.map(async task => {
      const collected = new Map();
      let until = untilNow, previousOldest = Infinity;
      for (let page = 0; page < 18; page++){
        if (session !== sess || document.visibilityState !== 'visible') break;
        const list = await query([{kinds:CONTENT_KINDS, authors:task.authors, since:task.since, until, limit:150}], 8000, [task.url]);
        if (!list.length) break;
        let oldest = Infinity;
        list.forEach(e => {
          if (!e || !Number.isFinite(e.created_at)) return;
          oldest = Math.min(oldest,e.created_at);
          if (e.created_at >= task.since && e.created_at <= untilNow) collected.set(e.id,e);
        });
        if (oldest <= task.since || list.length < 140 || oldest === Infinity) break;
        const next = oldest < previousOldest ? oldest : oldest-1;
        if (next < task.since || next >= until) break;
        previousOldest = oldest; until = next;
      }
      return [...collected.values()];
    }));
    if (session !== sess) return;
    for (const [pk,tries] of pendingFollowBackfill){
      if (!follows.includes(pk) || tries >= 2) pendingFollowBackfill.delete(pk);
      else pendingFollowBackfill.set(pk,tries+1);
    }
    queueFresh(batches.flat());
    if (commentsBackfillNeeded) {
      commentsBackfillNeeded = false;
      LS.set('book.commentsBackfilled.v1.'+sess.pk, true);
    }
    if (auto && fresh.length && idx <= 2){ clearTimeout(flushTimer); flushTimer = null; applyFresh(); }
  } catch(e) {
    // 连线失败保留本地内容；下次轮询和重连会重新补查。
  } finally {
    checking = false;
  }
}
function stopLive(){
  liveEpoch++;
  liveTimers.forEach(t => clearTimeout(t)); liveTimers.clear();
  liveSockets.forEach(w => { try{ w.close(); }catch(e){} }); liveSockets.clear();
}
function connectLive(url, epoch, authors, attempt = 0){
  if (epoch !== liveEpoch || !session || session.demo ||
      document.visibilityState !== 'visible' || !authors.length) return;
  let w;
  try { w = new WebSocket(url); } catch(e){ scheduleReconnect(url, epoch, authors, attempt); return; }
  liveSockets.add(w);
  w.onopen = () => {
    if (epoch !== liveEpoch){ w.close(); return; }
    const since = Math.max(0, Math.floor(Date.now() / 1000) - BACKFILL_OVERLAP);
    chunk(authors, 100).forEach((group, i) => {
      try { w.send(JSON.stringify(['REQ', 'live-' + epoch + '-' + i, {kinds:CONTENT_KINDS, authors:group, since, limit:200}])); }
      catch(e) { try{w.close();}catch(err){} }
    });
  };
  w.onmessage = m => {
    let data;
    try { data = JSON.parse(m.data); } catch(e) { return; }
    if (epoch === liveEpoch && data[0] === 'EVENT' &&
        typeof data[1] === 'string' && data[1].startsWith('live-' + epoch + '-'))
      queueFresh([data[2]]);
  };
  w.onclose = () => { liveSockets.delete(w); scheduleReconnect(url, epoch, authors, attempt + 1); };
  w.onerror = () => { try{ w.close(); }catch(e){} };
}
function scheduleReconnect(url, epoch, authors, attempt){
  if (epoch !== liveEpoch || document.visibilityState !== 'visible' || !session) return;
  const delay = Math.min(60000, 2000 * Math.pow(2, Math.min(attempt, 5)));
  const timer = setTimeout(() => { liveTimers.delete(timer); connectLive(url, epoch, authors, attempt); }, delay);
  liveTimers.add(timer);
}
function startLive(){
  stopLive();
  if (!session || session.demo || !follows.length || document.visibilityState !== 'visible') return;
  const epoch = liveEpoch;
  relayPlans().forEach(p => connectLive(p.url, epoch, p.authors));
}
function resumeSync(){
  if (!session || session.demo || document.visibilityState !== 'visible') return;
  startLive();
  const long = hiddenAt && Date.now() - hiddenAt > 600000;
  if (long && pages.length > 1 && !busy){ bar.hidden = true; show(1); }
  if (long || Date.now() - lastCheck > 120000) checkFresh(long);
  if (Date.now() - lastFollowsCheck > 10000) refreshFollows(session.pk);
  refreshRelayHints();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden'){ hiddenAt = Date.now(); stopLive(); return; }
  resumeSync();
});
window.addEventListener('online', resumeSync);
window.addEventListener('pageshow', e => { if (e.persisted) resumeSync(); });
setInterval(() => {
  if (!session || session.demo || document.visibilityState !== 'visible') return;
  if (Date.now() - lastCheck > 180000) checkFresh();
  if (Date.now() - lastFollowsCheck > FOLLOW_REFRESH_MS) refreshFollows(session.pk);
}, 60000);

/* ---------- 翻页 ---------- */
let idx = 0, busy = false, curEl = null;
const bar = document.getElementById('bar'), toastEl = document.getElementById('toast');
function mount(el){ book.insertBefore(el, bar); }
function after(){
  if (pages[idx].type === 'cover') bindCover(curEl);
  document.getElementById('where').textContent = idx === 0 ? '封面' : '第 ' + cn(idx) + ' 页';
  updateDot();
  if (applyPending && fresh.length) setTimeout(applyFresh, 0);
  if (session && idx > 0 && idx >= pages.length - 4) loadMore().then(() => { if (pages[idx]) document.getElementById('where').textContent = idx === 0 ? '封面' : '第 ' + cn(idx) + ' 页'; });
}
// 直接换页：先打断进行中的翻页动画，清掉书里所有旧页，免得有一张旧页（比如封面）压在上面
let turnNo = 0;
function show(i){
  turnNo++; busy = false;
  book.querySelectorAll('.page:not(.measure)').forEach(e => e.remove());
  idx = i; curEl = render(i); mount(curEl); after();
}
let toastT;
function toast(m){ toastEl.textContent = m; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 1800); }
function go(dir){
  if (busy) return;
  const j = idx + dir;
  if (j < 0) return;
  if (j >= pages.length){
    if (!session) return;
    if (!exhausted){ toast('正在取更早的篇章……'); loadMore(); }
    return;
  }
  busy = true; bar.hidden = true;
  const next = render(j), old = curEl;
  const my = ++turnNo;
  const done = () => { if (my !== turnNo) return; old.remove(); next.className = 'page'; curEl = next; idx = j; busy = false; after(); };
  if (reduce){ next.classList.add('fade-in'); mount(next); setTimeout(done, 260); return; }
  if (dir > 0){ next.classList.add('under'); book.insertBefore(next, old); old.classList.add('turn-out'); }
  else { next.classList.add('turn-in'); mount(next); old.classList.add('under-back'); }
  setTimeout(done, 600);
}

/* 手势：左滑下一页、右滑上一页；点左右两侧翻页，点中间呼出工具栏 */
let sx = 0, sy = 0, down = false;
book.addEventListener('pointerdown', e => { if (e.target.closest('input,button,a,.bar')) { down = false; return; } down = true; sx = e.clientX; sy = e.clientY; });
book.addEventListener('pointerup', e => {
  if (!down) return; down = false;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { go(dx < 0 ? 1 : -1); return; }
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10){
    const w = book.clientWidth, x = e.clientX - book.getBoundingClientRect().left;
    if (x > w * 0.68) go(1);
    else if (x < w * 0.32) go(-1);
    else if (session) bar.hidden = !bar.hidden;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(-1); }
});
document.getElementById('toLatest').addEventListener('click', () => { bar.hidden = true; if (fresh.length) applyFresh(); else if (pages.length > 1) show(1); });
document.getElementById('newPosts').addEventListener('click', applyFresh);
document.getElementById('syncNow').addEventListener('click', async () => {
  if (!session || session.demo) return;
  const current = session;
  toast('正在同步关注列表…');
  const updated = await refreshFollows(current.pk);
  if (session !== current) return;
  if (!updated) { toast('关注列表暂不可用，仍使用本地记录'); return; }
  await refreshRelayHints();
  await checkFresh(true);
  if (session === current) toast('关注 ' + follows.length + ' 人 · 已发起动态与评论同步');
});
book.addEventListener('click', e => {
  if (e.target.closest('.head .home')) { bar.hidden = true; show(0); }
  else if (e.target.closest('.head .when')) applyFresh();
});
document.getElementById('toCover').addEventListener('click', () => { bar.hidden = true; show(0); });
document.getElementById('logout').addEventListener('click', () => { bar.hidden = true; logout(); });

/* ---------- 会话 ---------- */
function reset(){ stopLive(); clearTimeout(flushTimer); flushTimer = null; fresh = []; applyPending = false; checking = false; pendingFollowBackfill = new Map(); commentsBackfillNeeded = false; findingRelayHints = false; lastCheck = 0; lastFollowsCheck = 0; pages = [{ type:'cover' }]; chapterNo = 0; days = []; held = []; seen = new Set(); exhausted = false; loading = false; follows = []; updateDot(); }
function logout(){ session = null; LS.del('book.pk'); LS.del(CACHE_KEY); reset(); coverState = 'login'; coverError = ''; show(0); }
async function start(pk, demo = false){
  reset(); session = { pk, demo }; cursor = Math.floor(Date.now() / 1000);
  commentsBackfillNeeded = !demo && !LS.get('book.commentsBackfilled.v1.'+pk,false);
  coverState = 'loading'; coverError = ''; show(0);
  if (demo){ buildDemo(); readerName = '示例读者'; }
  else {
    relayReached = false;
    // 关注列表（kind 3）各中继收得不全：连同资料中继一起问，没拿到再试一次
    const ask = () => query([{ kinds:[3], authors:[pk], limit:3 }], 8000,
      [...new Set([...PROFILE_RELAYS, ...(relayHints[pk] || [])])]);
    let c = await ask();
    if (!c.length){ await refreshRelayHints(); c = await ask(); }
    if (!relayReached){ session = null; coverState = 'login';
      coverError = '连不上中继。在预览里这个页面不能联网，部署到自己的网址后就能用；现在可以先看示例。'; show(0); return; }
    const latest = c.sort((a, b) => b.created_at - a.created_at)[0];
    follows = latest ? [...new Set(latest.tags.filter(t => t[0] === 'p' && /^[0-9a-f]{64}$/.test(t[1])).map(t => t[1]))].filter(x => x !== pk) : [];
    if (!follows.length){ session = null; coverState = 'login'; coverError = c.length ? '这个账号还没有关注任何人，书里暂时没有内容。' : '没从中继取到这个账号的关注列表，可能是网络不稳，请再试一次。'; show(0); return; }
    LS.set('book.pk', pk);
    await ensureNames([pk]); readerName = nameOf(pk);
  }
  await loadMore();
  coverState = 'ready';
  if (!demo){ startLive(); checkFresh(true); refreshRelayHints(); }
  if (idx === 0) show(0);
  if (pages.length > 1){
    setTimeout(() => { if (idx === 0) go(1); }, 500);
  }
}

/* ---------- 本地书库：装订好的篇章存在手机上，下次打开直接读，新的在后台查 ---------- */
const CACHE_KEY = 'book.cache', CACHE_MAX = 800;
function saveCache(){
  if (!session || session.demo || !days.length) return;
  const keep = []; let n = 0;
  for (const d of days){ if (n >= CACHE_MAX && keep.length) break; keep.push(d); n += d.posts.length; }   // 按整天截断
  const cut = keep.length < days.length;
  const posts = keep.flatMap(d => d.posts);
  LS.set(CACHE_KEY, { v:1, pk:session.pk, follows, posts, held: cut ? [] : held,
    cursor: cut ? posts[posts.length - 1].t - 1 : cursor, exhausted: cut ? false : exhausted });
}
function restore(pk){
  const c = LS.get(CACHE_KEY, null);
  if (!c || c.v !== 1 || c.pk !== pk || !Array.isArray(c.posts) || !c.posts.length) return false;
  reset(); session = { pk, demo:false };
  commentsBackfillNeeded = !LS.get('book.commentsBackfilled.v1.'+pk,false);
  follows = c.follows || []; cursor = c.cursor; exhausted = !!c.exhausted; held = c.held || [];
  c.posts.concat(held).forEach(p => seen.add(p.id));
  days = groupDays(c.posts.slice());
  days.forEach(paginateDay);
  if (exhausted) pages.push({ type:'end' });
  readerName = nameOf(pk); coverState = 'ready';
  show(Math.min(1, pages.length - 1));                           // 打开总是从最新一页读起
  startLive();
  const fresh0 = () => { if (session && session.pk === pk) checkFresh(true); };
  refreshFollows(pk).then(fresh0, fresh0);
  refreshRelayHints();
  return true;
}
async function refreshFollows(pk){
  if (!session || session.demo || session.pk !== pk) return false;
  lastFollowsCheck = Date.now();
  const c = await query([{ kinds:[3], authors:[pk], limit:3 }], 8000,
    [...new Set([...PROFILE_RELAYS, ...(relayHints[pk] || [])])]);
  const latest = c.sort((a, b) => b.created_at - a.created_at)[0];
  if (!latest || !session || session.pk !== pk) return false;
  const f = [...new Set(latest.tags.filter(t => t[0] === 'p' && /^[0-9a-f]{64}$/.test(t[1])).map(t => t[1]))].filter(x => x !== pk);
  if (f.join('|') !== follows.join('|')){
    const old = new Set(follows);
    f.filter(author => !old.has(author)).forEach(author => pendingFollowBackfill.set(author, 0));
    follows = f; saveCache(); startLive(); checkFresh(); refreshRelayHints();
  }
  ensureNames([pk]).catch(() => {});
  return true;
}

/* 屏幕尺寸或字体变化时重新排版，停在原来那一页 */
function repaginate(){
  if (!days.length) return;
  if (busy){ later(); return; }                                  // 翻页动画中重排会留下一张旧页，等动画结束
  const a = pages[idx] && pages[idx].anchor, ty = pages[idx] && pages[idx].type;
  pages = [{ type:'cover' }]; chapterNo = 0;
  days.forEach(paginateDay);
  if (exhausted) pages.push({ type:'end' });
  let at = a ? pages.findIndex(p => p.anchor === a && p.type === ty) : -1;
  if (at < 0) at = Math.min(idx, pages.length - 1);
  show(at);
}
let rt; const later = () => { clearTimeout(rt); rt = setTimeout(repaginate, 250); };
addEventListener('resize', later);
if (document.fonts) document.fonts.addEventListener('loadingdone', later);

/* ---------- 示例数据 ---------- */

/* ---------- 启动 ---------- */
window.bookWriterReader = () => session && !session.demo ? session.pk : null;
reset();
const ready = document.fonts ? document.fonts.ready : Promise.resolve();
ready.then(() => {
  const saved = LS.get('book.pk', null);
  if (saved){ if (!restore(saved)) start(saved); } else show(0);
});
if ('serviceWorker' in navigator && location.protocol === 'https:' && document.querySelector('link[rel="manifest"]')){
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) location.reload();
    hadController = true;
  });
  navigator.serviceWorker.register('sw.js').then(reg => {
    let lastUpdate = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && Date.now() - lastUpdate > 1800000){
        lastUpdate = Date.now(); reg.update().catch(() => {});
      }
    });
  }).catch(() => {});
}
})();
